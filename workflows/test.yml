name: Run Tests

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Navigate to backend directory
      run: cd backend

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Print Node.js version
      run: |
        cd backend
        node -v

    - name: Print npm version
      run: |
        cd backend
        npm -v

    - name: List project files
      run: |
        cd backend
        ls -la

    - name: Run tests
      run: |
        cd backend
        npm test
